[package]
name = "EasyGameHub"
version = "0.1.0"
description = "EasyGameHub - Automatic game save backup tool"
authors = ["Doona"]
edition = "2021"

[lib]
name = "easy_game_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.31"
winreg = "0.52"
thiserror = "1"
log = "0.4"
walkdir = "2"
anyhow = "1"
aes = "0.8"
ureq = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.7"
cbc = "0.1"
cipher = "0.4"
futures-util = "0.3"
tauri-plugin-store = "2"
url = "2"
urlencoding = "2"
tokio = { version = "1", features = ["net", "time", "sync"] }
steamlocate = "1"
steam-sdk = { path = "../steam-sdk" }
base64 = "0.22"
image = "0.25"
num-bigint = "0.4"
qrcode = "0.14"
rand = "0.8"
font-loader = "0.11.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
